<html lang="id">
<head>

<meta name="theme-color" content="#0b0d12">
<title>Amatu Playlist</title>
<meta name="description" content="Putar lagu YouTube & Spotify, playlist Pop Indonesia, Pop Jazz, lagu hits, radio, lirik sinkron dan equalizer profesional.">

<link rel="preconnect" href="https://yt.chocolatemoo53.com" crossorigin>

</head>
<body>

    <symbol id="i-sp" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.4a.6.6 0 0 1-.9.2c-2.4-1.5-5.4-1.8-9-1a.6.6 0 1 1-.3-1.2c3.9-.9 7.2-.5 9.9 1.1.3.2.4.6.3.9zm1.2-2.7a.8.8 0 0 1-1 .3c-2.7-1.7-6.9-2.2-10.1-1.2a.8.8 0 1 1-.5-1.5c3.7-1.1 8.3-.6 11.4 1.4.4.2.5.7.2 1zm.1-2.8C14.7 9 9.4 8.8 6.3 9.7a1 1 0 1 1-.6-1.8c3.5-1.1 9.4-.9 13.1 1.3a1 1 0 0 1-1 1.7z"/></symbol>

<div id="app">
  <aside id="side">
    <div class="brand"><span class="logo"><svg><use href="#i-music"/></svg></span> Amatu Playlist</div>
    <nav class="nav">
      <a href="#home" data-nav="home"><svg><use href="#i-home"/></svg>Beranda</a>
      <a href="#search" data-nav="search"><svg><use href="#i-search"/></svg>Cari</a>
      <a href="#radio" data-nav="radio"><svg><use href="#i-radio"/></svg>Radio</a>
      <a href="#library" data-nav="library"><svg><use href="#i-lib"/></svg>Pustaka</a>
    </nav>
    <div class="side-h">
      <span>Playlist saya</span>
      <button class="ib" id="newList" title="Buat playlist"><svg><use href="#i-plus"/></svg></button>
    </div>
    <div id="sideLists" class="side-lists"></div>
  </aside>

  <main id="main">
    <header id="top">
      <div class="hist">
        <button class="ib round" id="goBack" title="Kembali"><svg><use href="#i-back"/></svg></button>
        <button class="ib round" id="goFwd" title="Maju"><svg><use href="#i-fwd"/></svg></button>
      </div>
      <form id="sform" class="sbox" autocomplete="off">
        <svg><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Cari lagu, artis, album, playlist, atau tempel link YouTube/Spotify" enterkeyhint="search">
        <div id="sugg" class="sugg" hidden></div>
      </form>
      <div class="top-r">
        <button class="ib round" id="setBtn" title="Pengaturan"><svg><use href="#i-gear"/></svg></button>
        <button class="ib round" id="panelBtn" title="Panel diputar"><svg><use href="#i-panel"/></svg></button>
      </div>
    </header>
    <div id="view" tabindex="-1"></div>
  </main>

  <section id="panel">
    <div class="tabs" id="ptabs">
      <button data-tab="np" class="on">Diputar</button>
      <button data-tab="queue">Antrean</button>
      <button data-tab="lyrics">Lirik</button>
      <button data-tab="eq">EQ</button>
    </div>
    <div id="pbody"></div>
  </section>
</div>

<footer id="bar">
  <div class="b-now">
    <div class="b-art" id="bArt"></div>
    <div class="b-meta"><div class="b-title" id="bTitle">Belum ada lagu</div><div class="b-sub" id="bSub">Pilih lagu untuk mulai</div></div>
    <button class="ib like" id="bLike" title="Suka (L)"><svg><use href="#i-heart"/></svg></button>
  </div>
  <div class="b-mid">
    <div class="b-ctl">
      <button class="ib" id="cShuf" title="Acak (S)"><svg><use href="#i-shuffle"/></svg></button>
      <button class="ib" id="cPrev" title="Sebelumnya"><svg><use href="#i-prev"/></svg></button>
      <button class="playbtn" id="cPlay" title="Putar/Jeda (Spasi)"><svg><use href="#i-play"/></svg></button>
      <button class="ib" id="cNext" title="Berikutnya"><svg><use href="#i-next"/></svg></button>
      <button class="ib" id="cRep" title="Ulangi (R)"><svg><use href="#i-repeat"/></svg><i class="one">1</i></button>
    </div>
    <div class="b-seek"><span id="tCur">0:00</span><div class="range" id="seek"><div class="fill"></div><div class="buf"></div><div class="knob"></div><div class="tip"></div></div><span id="tDur">0:00</span></div>
  </div>
  <div class="b-r">
    <button class="ib" id="tLyr" title="Lirik"><svg><use href="#i-mic"/></svg></button>
    <button class="ib" id="tFly" title="Lirik mengambang"><svg><use href="#i-lyf"/></svg></button>
    <button class="ib" id="tQueue" title="Antrean (Q)"><svg><use href="#i-queue"/></svg></button>
    <button class="ib" id="tEq" title="Equalizer (E)"><svg><use href="#i-eq"/></svg></button>
    <button class="ib" id="tSpeed" title="Kecepatan"><svg><use href="#i-speed"/></svg><i class="badge" id="speedB"></i></button>
    <button class="ib" id="tTimer" title="Timer tidur"><svg><use href="#i-timer"/></svg><i class="badge" id="timerB"></i></button>
    <div class="vol"><button class="ib" id="tMute" title="Bisu (M)"><svg><use href="#i-vol"/></svg></button><div class="range small" id="vol"><div class="fill"></div><div class="knob"></div></div></div>
    <button class="ib" id="tPip" title="Mini player"><svg><use href="#i-pip"/></svg></button>
    <button class="ib" id="tFull" title="Layar penuh (F)"><svg><use href="#i-full"/></svg></button>
  </div>
  <div class="m-prog"><i id="mProg"></i></div>
</footer>

<nav id="tabbar">
  <a href="#home" data-nav="home"><svg><use href="#i-home"/></svg>Beranda</a>
  <a href="#search" data-nav="search"><svg><use href="#i-search"/></svg>Cari</a>
  <a href="#radio" data-nav="radio"><svg><use href="#i-radio"/></svg>Radio</a>
  <a href="#library" data-nav="library"><svg><use href="#i-lib"/></svg>Pustaka</a>
</nav>

<div id="fly" aria-live="off">
  <div class="fly-h"><span id="flyT">Lirik</span><button class="ib" id="flyFull" title="Lirik layar penuh"><svg><use href="#i-full"/></svg></button><button class="ib" id="flyX" title="Sembunyikan lirik mengambang"><svg><use href="#i-x"/></svg></button></div>
  <div class="fly-b" id="flyB"></div>
</div>

<div id="full" hidden>
  <div class="f-bg" id="fBg"></div>
  <canvas class="f-viz" id="fViz"></canvas>
  <header class="f-top">
    <button class="ib round" id="fClose" title="Tutup"><svg><use href="#i-down"/></svg></button>
    <div class="f-ctx" id="fCtx"></div>
    <button class="ib round" id="fMore" title="Opsi"><svg><use href="#i-more"/></svg></button>
  </header>
  <div class="f-body">
    <div class="f-left">
      <div class="f-stage" id="fStage"><div class="f-art" id="fArt"></div><div class="vslot" id="fSlot"></div></div>
      <div class="f-meta">
        <div><div class="f-title" id="fTitle"></div><div class="f-sub" id="fSub"></div></div>
        <button class="ib like" id="fLike"><svg><use href="#i-heart"/></svg></button>
      </div>
      <div class="f-seek"><div class="range" id="fSeek"><div class="fill"></div><div class="knob"></div></div><div class="f-times"><span id="fCur">0:00</span><span id="fDur">0:00</span></div></div>
      <div class="f-ctl">
        <button class="ib" id="fShuf"><svg><use href="#i-shuffle"/></svg></button>
        <button class="ib big" id="fPrev"><svg><use href="#i-prev"/></svg></button>
        <button class="playbtn xl" id="fPlay"><svg><use href="#i-play"/></svg></button>
        <button class="ib big" id="fNext"><svg><use href="#i-next"/></svg></button>
        <button class="ib" id="fRep"><svg><use href="#i-repeat"/></svg><i class="one">1</i></button>
      </div>
      <div class="f-tools">
        <button class="chip" data-ft="lyrics"><svg><use href="#i-mic"/></svg>Lirik</button>
        <button class="chip" data-ft="queue"><svg><use href="#i-queue"/></svg>Antrean</button>
        <button class="chip" data-ft="eq"><svg><use href="#i-eq"/></svg>EQ</button>
        <button class="chip" data-ft="video" id="fVid"><svg><use href="#i-video"/></svg>Video</button>
      </div>
    </div>
    <div class="f-right" id="fRight"></div>
  </div>
</div>

<div id="dock" class="off">
  <div class="dock-h"><span id="dockT">Video</span><button class="ib" id="dockMin" title="Perkecil"><svg><use href="#i-down"/></svg></button><button class="ib" id="dockOpen" title="Layar penuh"><svg><use href="#i-full"/></svg></button></div>
  <div id="ytwrap"><div id="ytp"></div></div>
  <div id="spwrap"><div id="spp"></div></div>
</div>

<div id="menu" class="menu" hidden></div>
<div id="modal" class="modal" hidden><div class="m-card" id="mcard"></div></div>
<div id="rsm" hidden><svg><use href="#i-play"/></svg><span>Putar <b id="rsmT"></b> <i>· sentuh di mana saja</i></span><button class="ib" id="rsmX" title="Jangan putar"><svg><use href="#i-x"/></svg></button></div>
<div id="toasts"></div>
<input type="file" id="fileIn" accept="audio/*,video/mp4,.mp3,.m4a,.flac,.wav,.ogg,.opus,.aac" multiple hidden>
<input type="file" id="impIn" accept="application/json,.json" hidden>

<script src="js/data.js?v=2"></script>
<script src="js/rock.js?v=1"></script>
<script src="js/fx.js?v=2"></script>
<script src="js/api.js?v=7"></script>
<script src="js/gap.js?v=1"></script>
<script src="js/engine.js?v=9"></script>
<script src="js/app.js?v=21"></script>
</body>
</html>
